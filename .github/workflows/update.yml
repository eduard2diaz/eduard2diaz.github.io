name: Update projects

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - projects.json
      - scripts/update_repos.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate repos.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_repos.py
      - name: Commit if changed
        run: |
          # "generated" cambia siempre; solo se hace commit si cambio algun repositorio
          if git diff --quiet -I'"generated"' -- repos.json; then
            git checkout -- repos.json
            echo "Sin cambios"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repos.json
            git commit -m "Update repos.json"
            git push
          fi
